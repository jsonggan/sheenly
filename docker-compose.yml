services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sheenly:sheenly@postgres:5432/sheenly
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sheenly
      POSTGRES_PASSWORD: sheenly
      POSTGRES_DB: sheenly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheenly -d sheenly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
